<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title id="t">Architecture of the review triage agent</title>
  <desc id="d">The owner's browser and an optional agent client reach one Node.js container. Inside, every call goes through invoke(), which reaches the agent tools, the owner-only verbs, and the store. The provider adapter calls a self-hosted Apertus server on the same network.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
  </defs>
  <rect x="6" y="6" width="768" height="328" rx="8" fill="none" stroke="#777" stroke-dasharray="6 4"/>
  <text x="16" y="24" font-weight="bold" fill="#333">The organisation's own network (on-premise; air-gapped when nothing in it can reach the outside)</text>

  <rect x="24" y="64" width="140" height="52" rx="5" fill="#eef4fb" stroke="#2f5d8a"/>
  <text x="94" y="86" text-anchor="middle">Owner</text>
  <text x="94" y="102" text-anchor="middle" font-size="11">browser dashboard</text>
  <rect x="24" y="190" width="140" height="52" rx="5" fill="#f3f3f3" stroke="#666"/>
  <text x="94" y="212" text-anchor="middle">Agent client</text>
  <text x="94" y="228" text-anchor="middle" font-size="11">optional, bearer token</text>

  <rect x="214" y="40" width="318" height="282" rx="6" fill="#fafafa" stroke="#444"/>
  <text x="373" y="58" text-anchor="middle" font-weight="bold">Docker container: one Node.js process</text>
  <rect x="230" y="68" width="286" height="32" rx="4" fill="#fff" stroke="#666"/>
  <text x="373" y="88" text-anchor="middle">Express: who is calling comes from the credential</text>
  <rect x="230" y="116" width="286" height="40" rx="4" fill="#fff6dd" stroke="#a07800" stroke-width="2"/>
  <text x="373" y="134" text-anchor="middle" font-weight="bold">invoke(tool, args, actor)</text>
  <text x="373" y="149" text-anchor="middle" font-size="11">the one chokepoint: every call, allowed or refused, is logged</text>
  <rect x="230" y="176" width="138" height="48" rx="4" fill="#fde9e7" stroke="#a33a2f" stroke-width="2"/>
  <text x="299" y="196" text-anchor="middle">Owner verbs</text>
  <text x="299" y="212" text-anchor="middle" font-size="11">publish, reject: owner only</text>
  <rect x="378" y="176" width="138" height="48" rx="4" fill="#fff" stroke="#666"/>
  <text x="447" y="196" text-anchor="middle">Agent tools</text>
  <text x="447" y="212" text-anchor="middle" font-size="11">list, triage, draft, get</text>
  <rect x="230" y="256" width="138" height="52" rx="4" fill="#fff" stroke="#666"/>
  <text x="299" y="276" text-anchor="middle">Store</text>
  <text x="299" y="292" text-anchor="middle" font-size="11">state machine, activity log</text>
  <rect x="378" y="256" width="138" height="52" rx="4" fill="#fff" stroke="#666"/>
  <text x="447" y="276" text-anchor="middle">Provider adapter</text>
  <text x="447" y="292" text-anchor="middle" font-size="11">classify, draftReply</text>

  <rect x="590" y="236" width="168" height="72" rx="5" fill="#e7f4ea" stroke="#2f7a3f"/>
  <text x="674" y="258" text-anchor="middle">Apertus v1.5 server</text>
  <text x="674" y="274" text-anchor="middle" font-size="11">OpenAI-compatible endpoint,</text>
  <text x="674" y="288" text-anchor="middle" font-size="11">address in LLM_BASE_URL</text>
  <text x="674" y="204" text-anchor="middle" font-size="11" fill="#333">The only outbound</text>
  <text x="674" y="218" text-anchor="middle" font-size="11" fill="#333">connection at runtime</text>

  <g stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M164 90 H230"/>
    <path d="M164 216 H190 V96 H230"/>
    <path d="M373 100 V116"/>
    <path d="M299 156 V176"/>
    <path d="M447 156 V176"/>
    <path d="M299 224 V256"/>
    <path d="M410 224 V240 H345 V256"/>
    <path d="M470 224 V256"/>
    <path d="M516 282 H590"/>
  </g>
  <text x="196" y="82" font-size="10.5" fill="#333" text-anchor="middle">cookie</text>
  <text x="224" y="170" font-size="10.5" fill="#333" text-anchor="end" transform="rotate(-90 196 170)">token</text>
  <text x="552" y="276" font-size="10.5" fill="#333" text-anchor="middle">chat</text>
</svg>
